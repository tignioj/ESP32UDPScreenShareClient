name: Build and release Windows app

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and publish (for example, v0.0.7)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: windows-release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

    steps:
      - name: Validate tag input
        shell: pwsh
        run: |
          if ($env:RELEASE_TAG -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+(?:[-+][0-9A-Za-z.-]+)?$') {
            throw "Tag must use a version such as v0.0.7: $env:RELEASE_TAG"
          }

      - name: Check out selected tag
        uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Verify tag belongs to main
        shell: pwsh
        run: |
          git fetch origin main --no-tags
          git show-ref --verify --quiet "refs/tags/$env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) {
            throw "Tag does not exist: $env:RELEASE_TAG"
          }

          $tagCommit = git rev-list -n 1 "refs/tags/$env:RELEASE_TAG"
          git merge-base --is-ancestor $tagCommit origin/main
          if ($LASTEXITCODE -ne 0) {
            throw "Tag $env:RELEASE_TAG does not point to a commit on main"
          }

          # Tags created before this packaging recipe was added can still be
          # rebuilt manually with the recipe currently maintained on main.
          if (-not (Test-Path -LiteralPath "packaging/windows.spec")) {
            New-Item -ItemType Directory -Force "packaging" | Out-Null
            git show "origin/main:packaging/windows.spec" | Set-Content -Encoding utf8 "packaging/windows.spec"
            if ($LASTEXITCODE -ne 0) {
              throw "Unable to load packaging/windows.spec from main"
            }
          }

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run tests
        run: uv run python -m unittest discover -s capture -p "test_*.py"

      - name: Build Windows application
        run: uv run --with pyinstaller pyinstaller packaging/windows.spec --noconfirm --clean

      - name: Verify packaged files
        shell: pwsh
        run: |
          $appDir = "dist/ESP32UDPScreenShareClient"
          $required = @(
            "$appDir/ESP32UDPScreenShareClient.exe",
            "$appDir/_internal/config_stream.yaml",
            "$appDir/_internal/sample_video"
          )
          foreach ($path in $required) {
            if (-not (Test-Path -LiteralPath $path)) {
              throw "Missing packaged file: $path"
            }
          }

      - name: Create release archive and checksum
        shell: pwsh
        run: |
          $archive = "ESP32UDPScreenShareClient-$env:RELEASE_TAG-windows-x64.zip"
          Compress-Archive -Path "dist/ESP32UDPScreenShareClient" -DestinationPath $archive
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $archive).Hash.ToLowerInvariant()
          "$hash  $archive" | Set-Content -Encoding ascii "$archive.sha256"
          "RELEASE_ARCHIVE=$archive" >> $env:GITHUB_ENV

      - name: Create or update GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view $env:RELEASE_TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:RELEASE_TAG $env:RELEASE_ARCHIVE "$env:RELEASE_ARCHIVE.sha256" --clobber
          } else {
            gh release create $env:RELEASE_TAG $env:RELEASE_ARCHIVE "$env:RELEASE_ARCHIVE.sha256" --verify-tag --generate-notes --title $env:RELEASE_TAG
          }
